<meta name="description" content="Which countries and regions already have a weekly semiconductor value-chain radar: organisations, activity and status per region, with a link to each full radar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4; --panel:#FFFFFF; --panel2:#F6F8FA; --ink:#10161D; --muted:#5A6672; --faint:#8A96A3; --line:#D6DCE2; --line2:#E6EAEE;
  --blue:#0066B5; --blue-deep:#004C86; --blue-soft:#E3EEF8; --ring2:#4A86C5; --warn:#B45309; --warn-bg:#FFF4E0;
  --sea:#E7EFF7; --land:#D8DFE6; --land-line:#FFFFFF; --parent:#BFD6EC; --pilot:#7FAEDC; --collect:#CFE3F5;
  --shadow:0 12px 30px -18px rgba(20,80,143,.35);
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#0E131A; --panel:#161D27; --panel2:#1B2330; --ink:#E8EDF2; --muted:#A5AFBC; --faint:#6F7A89; --line:#2A3441; --line2:#222B37;
  --blue:#3B8FD9; --blue-deep:#6FAEE8; --blue-soft:#1A2A3D; --ring2:#2F6AA3; --warn:#F2B35A; --warn-bg:#2A2110;
  --sea:#0F1620; --land:#2A3542; --land-line:#161D27; --parent:#2A4866; --pilot:#2F6AA3; --collect:#223A52;
  --shadow:0 12px 30px -18px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.4;font-size:15px;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
a{color:var(--blue)}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 40px}
.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.kicker{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:"Space Grotesk",Inter,sans-serif;font-weight:700;font-size:clamp(22px,3.2vw,34px);line-height:1.1;margin:4px 0 6px;letter-spacing:-.01em}
.lede{margin:0;max-width:760px;color:var(--muted);font-size:15px}
.ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lang,.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.lang button,.seg button{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;letter-spacing:.08em;padding:6px 12px;border:0;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
.lang button.on,.seg button.on{background:var(--blue);color:#fff}
.ico{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;width:32px;height:32px;cursor:pointer;font-size:15px;line-height:1}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:0 0 14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile .v{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:24px;line-height:1.1;color:var(--blue)}
.tile .l{font-size:12px;color:var(--muted);margin-top:3px}
.bar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.mapbox{position:relative;background:var(--sea);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.mapbox svg{display:block;width:100%;height:auto}
.sphere{fill:var(--sea)}
.land{fill:var(--land);stroke:var(--land-line);stroke-width:.5;transition:fill .15s}
.land.parent{fill:var(--parent)}
.land.tracked{fill:var(--blue)}
.land.pilot{fill:var(--pilot)}
.land.collecting{fill:var(--collect);stroke:var(--blue);stroke-width:.6;stroke-dasharray:2 1.5}
.land.micro{stroke:var(--muted);stroke-width:.4}
.land.micro.collecting,.land.micro.tracked,.land.micro.pilot{stroke:var(--blue);stroke-dasharray:none}
.land.hov{fill-opacity:.82;stroke:var(--ink);stroke-width:.9}
.land.pointer,.state.pointer,.badge{cursor:pointer}
.state{fill:var(--blue);stroke:var(--land-line);stroke-width:.6}
.state.collecting{fill:var(--collect);stroke:var(--blue);stroke-dasharray:2 1.5;stroke-width:.7}
.state.hov{fill-opacity:.82;stroke:var(--ink);stroke-width:.9}
.badge rect{fill:var(--blue);stroke:#fff;stroke-width:1.2}
.badge.pilot rect{fill:var(--pilot)}
.badge.collect rect{fill:var(--panel);stroke:var(--blue);stroke-dasharray:3 2}
.badge.collect text{fill:var(--blue)}
.badge text{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13px;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.badge .sub{font-size:9.5px;font-weight:500;fill:#fff;opacity:.85}
.badge .lead{stroke:var(--ink);stroke-width:1;opacity:.55;fill:none}
.badge .dot{fill:var(--ink);opacity:.6}
.badge:hover rect{filter:brightness(1.12)}
.tip{position:absolute;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.35;min-width:200px;max-width:300px;box-shadow:0 14px 34px -14px rgba(0,0,0,.45);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;z-index:3}
.tip.on{opacity:1;transform:none}
.tip h4{margin:0 0 4px;font-family:"Space Grotesk",Inter,sans-serif;font-size:15px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tip .code{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);letter-spacing:.06em}
.tip .st{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--blue-soft);color:var(--blue);margin:2px 0 6px}
.tip .st.pilot{background:var(--warn-bg);color:var(--warn)}
.tip .st.none{background:var(--line2);color:var(--muted)}
.tip .st.collecting,.card .st.collecting,.chip.collecting{background:var(--collect);color:var(--blue-deep)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--blue);border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--ink);background:var(--panel)}
.chip b{font-family:"IBM Plex Mono",monospace;font-weight:600}
.chip .code{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);letter-spacing:.06em}
.tip .nums{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;margin:2px 0 6px}
.tip .nums b{font-family:"IBM Plex Mono",monospace;font-weight:600;text-align:right}
.tip .nums span{color:var(--muted)}
.tip .segs{display:flex;height:6px;border-radius:3px;overflow:hidden;margin:4px 0 5px;background:var(--line2)}
.tip .segs i{display:block;height:100%}
.tip .seglist{color:var(--muted);font-size:12px}
.tip .seglist i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.tip .act{margin-top:6px;font-size:12px;color:var(--blue);font-weight:500}
.tip .sub{border-top:1px solid var(--line2);margin-top:6px;padding-top:6px}
.tip .sub div{display:flex;justify-content:space-between;gap:10px}
.tip .sub b{font-family:"IBM Plex Mono",monospace;font-weight:600}
.hint{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--muted);pointer-events:none;background:color-mix(in srgb,var(--sea) 80%,transparent);padding:2px 6px;border-radius:6px}
.legend{display:flex;gap:14px 20px;flex-wrap:wrap;margin:10px 2px 0;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:10px;border-radius:2px;display:inline-block;border:1px solid var(--line)}
h2{font-family:"Space Grotesk",Inter,sans-serif;font-size:19px;margin:26px 0 10px;letter-spacing:-.01em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px;display:flex;flex-direction:column;gap:8px;border-top:3px solid var(--blue)}
.card.pilot{border-top-color:var(--pilot)}
.card .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card .h b{font-family:"Space Grotesk",Inter,sans-serif;font-size:17px}
.card .h small{display:block;color:var(--muted);font-weight:400;font-size:12.5px;margin-top:1px}
.card .code{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);letter-spacing:.08em;white-space:nowrap;padding-top:4px}
.card .st{align-self:flex-start;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--blue-soft);color:var(--blue)}
.card .st.pilot{background:var(--warn-bg);color:var(--warn)}
.card .nums{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:2px}
.card .nums div{text-align:center;background:var(--panel2);border-radius:8px;padding:6px 2px}
.card .nums b{display:block;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:16px;color:var(--ink)}
.card .nums span{font-size:10.5px;color:var(--muted);display:block;line-height:1.15;margin-top:1px}
.card .segs{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line2)}
.card .segs i{display:block;height:100%}
.card .seglist{font-size:12px;color:var(--muted)}
.card .seglist i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.card .meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.btn{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;letter-spacing:.06em;padding:6px 12px;border-radius:999px;border:1px solid var(--blue);color:#fff;background:var(--blue);text-decoration:none}
.btn.sec{background:transparent;color:var(--blue)}
.about{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:16px;color:var(--ink);font-size:14.5px}
.about p{margin:6px 0}
.about ol{margin:6px 0 6px 18px;padding:0}
.about li{margin:3px 0}
footer{margin-top:18px;font-size:12px;color:var(--faint);line-height:1.5}
footer a{color:var(--muted)}
@media (max-width:640px){
  .wrap{padding:12px 10px 30px}
  .tile .v{font-size:20px}
  .card .nums{grid-template-columns:repeat(5,1fr)}
  .tip{max-width:260px;font-size:12.5px}
  .tip .segs,.tip .sl{display:none}
  .hint{display:none}
}
.seglist.esra{color:var(--blue);font-weight:500}
.esra{fill:url(#esraHatch);stroke:var(--esra);stroke-width:.9;pointer-events:none}:root{--esra:#E8590C;--esra-bg:rgba(232,89,12,.10)}#metric{display:none}.esra-toggle{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);cursor:pointer;margin-left:10px}.esra-toggle i{width:14px;height:10px;display:inline-block;border:1px solid var(--esra);background:repeating-linear-gradient(45deg,var(--esra-bg),var(--esra-bg) 2px,var(--esra) 2px,var(--esra) 3px)}\n.zoomctl{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:4px;z-index:3}.zoomctl button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card,#fff);color:var(--ink);font-size:17px;line-height:1;cursor:pointer;box-shadow:var(--shadow)}.zoomctl button:hover{border-color:var(--blue);color:var(--blue)}
.mapbox svg{touch-action:pan-y;cursor:grab}.mapbox svg.dragging{cursor:grabbing}.land,.state,.esra{vector-effect:non-scaling-stroke}
.layers{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;margin-left:auto}.lt{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);cursor:pointer}.lt svg,.legend svg{width:14px;height:14px;flex:none}
.poi{cursor:pointer}.poi .sh{stroke:#fff;stroke-width:calc(1.1px * var(--sw, 1))}.poi.hov .sh,.poi.open .sh{stroke:var(--ink);stroke-width:calc(1.6px * var(--sw, 1))}.poi.assoc .sh{fill-opacity:.55}
.plsites .conn{stroke-width:1;vector-effect:non-scaling-stroke;opacity:.5}.site{cursor:default}.site .sp{stroke-width:calc(1.4px * var(--sw, 1))}.site.hov .sp{stroke-width:calc(2.2px * var(--sw, 1))}
.plpanel{position:absolute;left:10px;top:10px;max-width:300px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.4;box-shadow:0 10px 24px -14px rgba(0,0,0,.4);z-index:2;display:none}.plpanel.on{display:block}.plpanel .pl{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:2px 0}.plpanel .pl i{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}.plpanel .pl b{font-family:"Space Grotesk",Inter,sans-serif}.plpanel .pl span{color:var(--muted)}.plpanel a{color:var(--blue);text-decoration:none;font-weight:500}.plpanel button{border:0;background:var(--line2);color:var(--muted);border-radius:6px;cursor:pointer;font-size:11px;padding:1px 6px;margin-left:auto}.plpanel .note{color:var(--muted);font-size:11px;border-top:1px solid var(--line2);margin-top:5px;padding-top:5px}@media(max-width:640px){.plpanel{position:static;max-width:none;border:0;border-top:1px solid var(--line);border-radius:0;box-shadow:none;font-size:11.5px;background:var(--panel)}}
@media(max-width:640px){.layers{margin-left:0;width:100%}}
</style>
</head>

      badges.push({ x, y, v: sum(rs, 'orgs'), sub: g, pilot: false, collect: rs[0].status === 'collecting', w: sum(rs, 'orgs'), t: { kind: 'group', group: g } });
    });
  } else {
    ALL.forEach(r => {
      let c = null;
      if (r.level === 'state') { const s = G.states.find(x => x.id === r.id); c = s && s.c; }
      else { const cc = G.countries.find(x => x.a2 === r.a2); c = cc && cc.c; }
      if (!c) return;
      badges.push({ x: c[0], y: c[1], v: r.status === 'collecting' ? r.orgs : r[METRIC], sub: r.level === 'state' ? r.id.split('-')[1] : r.a2, pilot: r.status === 'pilot', collect: r.status === 'collecting', w: r.orgs, t: { kind: 'region', id: r.id } });
    });
  }
  }
}

function drawBadges(bs, G) {
  const k = Math.max(0.2, svg.getBoundingClientRect().width / G.W) || 1; // px per unit
  const inv = 1 / k;
  const g = el('g', { class: 'badges' }, svg);
  // layout in pixel space
  const lift = VIEW === 'world' ? -30 : 0;
  bs.forEach(b => { b.px = b.x * k; b.py = b.y * k; b.text = fmt(b.v); b.bw = 14 + b.text.length * 8.2 + (b.sub ? 6 + b.sub.length * 6 : 0); b.bh = 22; b.ox = 0; b.oy = lift; });
  bs.sort((a, b) => b.w - a.w);
  // relaxation: push overlapping badges apart (both axes), weak pull back to the anchor
  for (let it = 0; it < 120; it++) {
    let moved = false;
    for (let i = 0; i < bs.length; i++) for (let j = i + 1; j < bs.length; j++) {
      const a = bs[i], b = bs[j];
      const ax = a.px + a.ox, ay = a.py + a.oy, bx = b.px + b.ox, by = b.py + b.oy;
      const dx = bx - ax, dy = by - ay;
      const ox = (a.bw + b.bw) / 2 + 6 - Math.abs(dx), oy = a.bh + 6 - Math.abs(dy);
      if (ox > 0 && oy > 0) {
        moved = true;
        // move along the axis that needs the smaller shift, scaled by weight (heavier moves less)
        const wa = b.w / (a.w + b.w || 1), wb = 1 - wa;
        if (ox * 0.6 < oy) { const s = Math.sign(dx) || 1; a.ox -= s * ox * wa; b.ox += s * ox * wb; }
        else { const s = Math.sign(dy) || 1; a.oy -= s * oy * wa; b.oy += s * oy * wb; }
      }
    }
    if (!moved) break;
  }
  // keep badges inside the map box
  const Wpx = G.W * k, Hpx = G.H * k;
  bs.forEach(b => {
    const x = b.px + b.ox, y = b.py + b.oy;
    if (x - b.bw / 2 < 4) b.ox += 4 - (x - b.bw / 2); if (x + b.bw / 2 > Wpx - 4) b.ox -= (x + b.bw / 2) - (Wpx - 4);
    if (y - b.bh / 2 < 4) b.oy += 4 - (y - b.bh / 2); if (y + b.bh / 2 > Hpx - 4) b.oy -= (y + b.bh / 2) - (Hpx - 4);
  });
  bs.forEach(b => {
    const grp = el('g', { class: 'badge' + (b.pilot ? ' pilot' : '') + (b.collect ? ' collect' : ''), transform: `translate(${b.x.toFixed(1)},${b.y.toFixed(1)}) scale(${inv.toFixed(4)})` }, g);
    grp.__t = b.t;
    if (Math.abs(b.oy) > 14 || Math.abs(b.ox) > 8) {
      el('line', { class: 'lead', x1: 0, y1: 0, x2: b.ox, y2: b.oy + b.bh / 2 }, grp);
      el('circle', { class: 'dot', r: 2.2, cx: 0, cy: 0 }, grp);
    }
    el('rect', { x: b.ox - b.bw / 2, y: b.oy - b.bh / 2, width: b.bw, height: b.bh, rx: 11 }, grp);
    if (b.sub) {
      const tw = b.text.length * 8.2, sw = b.sub.length * 6;
      const total = tw + 6 + sw, start = b.ox - total / 2;
      const tx = el('text', { x: start + tw / 2, y: b.oy }, grp); tx.textContent = b.text;
      const sx = el('text', { x: start + tw + 6 + sw / 2, y: b.oy + 1, class: 'sub' }, grp); sx.textContent = b.sub;
    } else {
      const tx = el('text', { x: b.ox, y: b.oy }, grp); tx.textContent = b.text;
    }
  });
}

// ---------- tooltip ----------
function esraLine(r, tr) {
  const e = r.esra; if (!e) return '';
  if (r.level === 'state') return e.member ? `<div class="seglist esra">${esc(tr.esraMember)}${e.role === 'initiator' ? ' · ' + esc(tr.esraInit) : ''} (${e.since})</div>` : '';
  if (!e.n) return `<div class="seglist esra">${esc(tr.esraNone)}</div>`;
  return `<div class="seglist esra">ESRA: ${e.n} ${esc(e.n === 1 ? tr.esraRegion : tr.esraRegions)} – ${esc(e.regions.join(', '))}</div>`;
}
function esraCountry(a2, tr) { const l = (IDX.esra && IDX.esra.byCountry[a2]) || []; return l.length ? `<div class="seglist esra">ESRA: ${l.length} ${esc(l.length === 1 ? tr.esraRegion : tr.esraRegions)} – ${esc(l.join(', '))}</div>` : `<div class="seglist esra">${esc(tr.esraNone)}</div>`; }
function astLine(r, tr) { return r.ipcei_ast ? `<div class="seglist">${esc(tr.ipceiAst)}: <b>${fmt(r.ipcei_ast)}</b> · ${esc(tr.ipceiAstNote)}</div>` : ''; }
function tipHtml(t) {
  const tr = T[LANG];
  if (t.kind === 'poi') {
    const p = POINTS.points.find(x => x.id === t.id); if (!p) return '';
    const ln = POINTS.layers[p.l][LANG] || POINTS.layers[p.l].en;
    if (p.sites) return `<h4><span>${esc(p.n)}</span><span class="code">${esc(p.a2)}</span></h4>
      <span class="st" style="background:${LCOL[p.l]}22;color:${LCOL[p.l]}">${esc(ln)}</span>
      <div class="seglist" style="margin-top:6px">${esc(p.host)} · ${esc(p.city)}${p.note ? ' · ' + esc(p.note) : ''}</div>
      <div class="seglist">${esc(tr.plParts(p.sites.length))}${p.acronym && p.acronym !== p.n ? ' · ' + esc(p.acronym) : ''}</div>
      <div class="act">${esc(PL_OPEN[p.id] ? tr.plHide : tr.plOpen)}</div>`;
    return `<h4><span>${esc(p.n)}</span><span class="code">${esc(p.a2)}</span></h4>
      <span class="st" style="background:${LCOL[p.l]}22;color:${LCOL[p.l]}">${esc(ln)}</span>
      <div class="seglist" style="margin-top:6px">${esc(p.host)} · ${esc(p.city)}${p.note ? ' · ' + esc(p.note) : ''}</div>
      ${p.u ? `<div class="act">${esc(tr.clickSite)} ↗</div>` : ''}`;
  }
  if (t.kind === 'site') {
    const p = POINTS.points.find(x => x.id === t.pl); const q = p && p.sites && p.sites[t.i]; if (!q) return ''; const c = plColor(p.id);
    return `<h4><span>${esc(q.n)}</span><span class="code">${esc(q.a2)}</span></h4>
      <span class="st" style="background:${c}22;color:${c}">${esc(p.n)} · ${esc(tr['role' + q.role] || q.role)}</span>
      <div class="seglist" style="margin-top:6px">${esc(q.city)}</div>`;
  }
  if (t.kind === 'region') {
    const r = regById[t.id];
    if (r.status === 'collecting') return `<h4><span>${esc(r.name[LANG])}</span><span class="code">${r.a2}</span></h4>
      <span class="st collecting">${esc(IDX.statuses.collecting[LANG])}</span>
      <div class="nums"><span>${esc(tr.orgs)}</span><b>${fmt(r.orgs)}</b>${r.news ? `<span>${esc(tr.news)}</span><b>${fmt(r.news)}</b>` : ''}</div>
      <div class="seglist">${esc(tr.collectLine(fmt(r.orgs), r.batches))} · ${fd(r.updated)}</div>
      ${esraLine(r, tr)}
      <div class="seglist" style="margin-top:4px">${r.url ? esc(tr.previewLine) : esc(tr.noAction)}</div>${(r.card || r.url) ? `<div class="act">${esc(pinned && pinned.touch ? tr.tapAgain : (r.card ? tr.clickCard : tr.clickOpen))} ↗</div>` : ''}`;
    return `<h4><span>${esc(r.name[LANG])}</span><span class="code">${r.id}</span></h4>
      <span class="st ${r.status}">${esc(IDX.statuses[r.status][LANG])}</span>
      <div class="nums"><span>${esc(tr.orgs)}</span><b>${fmt(r.orgs)}</b><span>${esc(tr.active31)}</span><b>${fmt(r.active31)}</b><span>${esc(tr.news)}</span><b>${fmt(r.news)}</b><span>${esc(tr.events)}</span><b>${fmt(r.events)}</b>${r.ipcei ? `<span>${esc(tr.ipcei)}</span><b>${fmt(r.ipcei)}</b>` : ''}</div>
      ${segBar(r, true)}
      <div class="seglist" style="margin-top:4px">${esc(tr.edition)} ${esc(r.edition)} · ${esc(tr.updated)} ${fd(r.updated)}</div>
      ${astLine(r, tr)}${esraLine(r, tr)}
      ${(r.card || r.url) ? `<div class="act">${esc(pinned && pinned.touch ? tr.tapAgain : (r.card ? tr.clickCard : tr.clickOpen))} ↗</div>` : `<div class="seglist">${esc(tr.internal)}</div>`}`;
  }
  const rs = byA2[t.a2];
  const nm = countryName(t.a2);
  if (rs && rs.length === 1 && rs[0].level === 'country') return tipHtml({ kind: 'region', id: rs[0].id });
  if (t.kind === 'group') {
    const gs = ALL.filter(r => r.group === t.group);
    return `<h4><span>${esc(gs.map(r => r.name[LANG]).join(' · '))}</span><span class="code">${t.group}</span></h4>
      <span class="st collecting">${esc(IDX.statuses.collecting[LANG])}</span>
      <div class="nums"><span>${esc(tr.orgs)}</span><b>${fmt(sum(gs,'orgs'))}</b></div>
      <div class="sub">${gs.map(r => `<div><span>${esc(r.name[LANG])} <span class="code">${r.a2}</span></span><b>${fmt(r.orgs)}</b></div>`).join('')}</div>
      <div class="seglist" style="margin-top:4px">${gs[0].url ? esc(tr.previewLine) : esc(tr.noAction)}</div>${gs[0].url ? `<div class="act">${esc(tr.clickOpen)} ↗</div>` : ''}`;
  }
  if (!rs) return `<h4><span>${esc(nm)}</span><span class="code">${t.a2}</span></h4><span class="st none">${esc(tr.notCovered)}</span>${esraCountry(t.a2, tr)}<div class="seglist">${esc(tr.join)}</div>`;
  // parent country with regional radars
  return `<h4><span>${esc(nm)}</span><span class="code">${t.a2}</span></h4>
    <span class="st">${esc(tr.parentLine(rs.length))}</span>
    <div class="nums"><span>${esc(tr.orgs)}</span><b>${fmt(sum(rs,'orgs'))}</b><span>${esc(tr.active31)}</span><b>${fmt(sum(rs,'active31'))}</b><span>${esc(tr.news)}</span><b>${fmt(sum(rs,'news'))}</b></div>
    <div class="sub">${rs.map(r => `<div><span>${esc(r.name[LANG])} <span class="code">${r.id}</span>${r.status === 'collecting' ? ` <span class="st collecting" style="margin:0">${esc(IDX.statuses.collecting[LANG])}</span>` : ''}</span><b>${fmt(r.status === 'collecting' ? r.orgs : r[METRIC])}</b></div>`).join('')}</div>
    ${esraCountry(t.a2, tr)}
    <div class="act">${esc(VIEW === 'world' ? tr.clickZoom : tr.clickOpen)} ↗</div>`;
}
function showTip(t, x, y) {
  tip.innerHTML = tipHtml(t); tip.classList.add('on');
  const bw = box.clientWidth, bh = box.clientHeight, tw = tip.offsetWidth, th = tip.offsetHeight;
  let lx = x + 14, ly = y + 14;
  if (lx + tw > bw - 6) lx = x - tw - 14; if (lx < 6) lx = 6;
  if (ly + th > bh - 6) ly = y - th - 14; if (ly < 6) ly = 6;
  tip.style.left = lx + 'px'; tip.style.top = ly + 'px';
}
function hideTip() { tip.classList.remove('on'); }
function targetOf(e) { let n = e.target; while (n && n !== svg) { if (n.__t) return n; n = n.parentNode; } return null; }
let hov = null;
svg.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch') return;
  const n = targetOf(e);
  if (hov && hov !== n) { hov.classList.remove('hov'); hov = null; }
  if (!n) { if (!pinned) hideTip(); return; }
  if (n.classList.contains('land') || n.classList.contains('state') || n.classList.contains('poi') || n.classList.contains('site')) { n.classList.add('hov'); hov = n; }
  const r = box.getBoundingClientRect();
  pinned = null; showTip(n.__t, e.clientX - r.left, e.clientY - r.top);
});
svg.addEventListener('pointerleave', () => { if (hov) { hov.classList.remove('hov'); hov = null; } if (!pinned) hideTip(); });
function activate(t) {
  if (t.kind === 'poi') { const p = POINTS.points.find(x => x.id === t.id); if (p && p.sites) { togglePl(p.id); hideTip(); pinned = null; return; } if (p && p.u) window.open(p.u, '_blank', 'noopener'); return; }
  if (t.kind === 'site') return;
  if (t.kind === 'region') { const r = regById[t.id]; const u = r.card || r.url; if (u) window.open(u, '_blank', 'noopener'); return; }
  if (t.kind === 'group') { const g = ALL.find(r => r.group === t.group && (r.card || r.url)); if (g) window.open(g.card || g.url, '_blank', 'noopener'); return; }
  if (t.kind === 'country' && byA2[t.a2] && byA2[t.a2].every(r => !r.url)) return;
  const rs = byA2[t.a2]; if (!rs) return;
  if (rs.length === 1 && rs[0].level === 'country') { const u = rs[0].card || rs[0].url; if (u) window.open(u, '_blank', 'noopener'); return; }
  if (VIEW === 'world') { setView('europe'); }
}
let lastTouch = 0;
svg.addEventListener('click', e => {
  if (Date.now() - lastTouch < 800) return; // handled by the touch path below
  const n = targetOf(e); if (!n) { pinned = null; hideTip(); return; }
  activate(n.__t);
});
// touch: first tap shows the tooltip, second tap on the same target opens
svg.addEventListener('pointerup', e => {
  if (e.pointerType !== 'touch') return;
  if (moved || ptrs.size > 1) { return; }
  lastTouch = Date.now();
  const n = targetOf(e); if (!n) { pinned = null; hideTip(); return; }
  const key = JSON.stringify(n.__t); const r = box.getBoundingClientRect();
  if (pinned && pinned.key === key) { pinned = null; hideTip(); activate(n.__t); }
  else { pinned = { key, touch: true }; showTip(n.__t, e.clientX - r.left, e.clientY - r.top); }
});

// ---------- zoom & pan (viewBox based; wheel, drag, pinch, buttons) ----------
const ZOOM = { world: null, europe: null };   // {x,y,w,h} per view, null = full extent
function fullBox(G) { return { x: 0, y: 0, w: G.W, h: G.H }; }
function curG() { return VIEW === 'world' ? WORLD : EUROPE; }
function applyZoom(G) { const z = ZOOM[VIEW] || fullBox(G); svg.setAttribute('viewBox', `${z.x} ${z.y} ${z.w} ${z.h}`); svg.style.touchAction = ZOOM[VIEW] ? 'none' : 'pan-y';
  const s = z.w / G.W; const pat = svg.querySelector('#esraHatch'); if (pat) { pat.setAttribute('width', 5 * s); pat.setAttribute('height', 5 * s); const ln = pat.querySelector('line'); if (ln) { ln.setAttribute('y2', 5 * s); ln.setAttribute('stroke-width', 1.1 * s); } }
  if (svg.querySelector('g.pois')) renderPois(); const zc = $('zoomctl'); if (zc) zc.classList.toggle('zoomed', !!ZOOM[VIEW]); }
function clampBox(z, G) {
  const minW = G.W / 10; z.w = Math.min(G.W, Math.max(minW, z.w)); z.h = z.w * G.H / G.W;
  z.x = Math.min(G.W - z.w, Math.max(0, z.x)); z.y = Math.min(G.H - z.h, Math.max(0, z.y)); return z;
}
function svgPoint(clientX, clientY) { const r = svg.getBoundingClientRect(); const z = ZOOM[VIEW] || fullBox(curG()); return [z.x + (clientX - r.left) / r.width * z.w, z.y + (clientY - r.top) / r.height * z.h]; }
function zoomAt(factor, cx, cy) {  // factor > 1 zooms in; (cx, cy) in viewBox units stays fixed
  const G = curG(); const z = Object.assign({}, ZOOM[VIEW] || fullBox(G));
  const nw = z.w / factor; if (nw >= G.W) { ZOOM[VIEW] = null; applyZoom(G); return; }
  const nx = cx - (cx - z.x) / factor, ny = cy - (cy - z.y) / factor;
  ZOOM[VIEW] = clampBox({ x: nx, y: ny, w: nw, h: nw * G.H / G.W }, G); applyZoom(G);
}
function panBy(dx, dy) { const G = curG(); if (!ZOOM[VIEW]) return; const z = Object.assign({}, ZOOM[VIEW]); z.x -= dx; z.y -= dy; ZOOM[VIEW] = clampBox(z, G); applyZoom(G); }
svg.addEventListener('wheel', e => { e.preventDefault(); const [cx, cy] = svgPoint(e.clientX, e.clientY); const f = Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0018)); zoomAt(f, cx, cy); hideTip(); }, { passive: false });
$('zoomctl').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const G = curG(); const z = ZOOM[VIEW] || fullBox(G); const cx = z.x + z.w / 2, cy = z.y + z.h / 2;
  if (b.dataset.z === 'in') zoomAt(1.6, cx, cy); else if (b.dataset.z === 'out') zoomAt(1 / 1.6, cx, cy); else { ZOOM[VIEW] = null; applyZoom(G); } hideTip(); });
const ptrs = new Map(); let drag = null, pinch = null, moved = false;
svg.addEventListener('pointerdown', e => { ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved = false;
  if (ptrs.size === 1) { drag = { x: e.clientX, y: e.clientY }; }
  else if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), cx: (a[0] + b[0]) / 2, cy: (a[1] + b[1]) / 2 }; drag = null; }
  });
svg.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (pinch && ptrs.size === 2) { const [a, b] = [...ptrs.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); const cx = (a[0] + b[0]) / 2, cy = (a[1] + b[1]) / 2;
    if (d > 0 && pinch.d > 0) { const [sx, sy] = svgPoint(pinch.cx, pinch.cy); zoomAt(d / pinch.d, sx, sy); const r = svg.getBoundingClientRect(); const z = ZOOM[VIEW] || fullBox(curG()); panBy((cx - pinch.cx) / r.width * z.w, (cy - pinch.cy) / r.height * z.h); }
    pinch = { d, cx, cy }; moved = true; hideTip(); return; }
  if (drag && e.pointerType === 'touch' && !ZOOM[VIEW]) return;  // not zoomed: one finger scrolls the page
  if (drag && (e.buttons & 1 || e.pointerType === 'touch')) { const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!moved && Math.hypot(dx, dy) < 4) return; moved = true; svg.classList.add('dragging');
    const r = svg.getBoundingClientRect(); const z = ZOOM[VIEW] || fullBox(curG()); panBy(dx / r.width * z.w, dy / r.height * z.h); drag = { x: e.clientX, y: e.clientY }; hideTip(); }
});
function endPtr(e) { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (ptrs.size === 0) { drag = null; svg.classList.remove('dragging'); } }
svg.addEventListener('pointerup', endPtr); svg.addEventListener('pointercancel', endPtr); window.addEventListener('pointerup', endPtr);
svg.addEventListener('click', e => { if (moved) { e.stopImmediatePropagation(); e.preventDefault(); moved = false; } }, true);

// ---------- controls ----------
function setView(v) { VIEW = v; pinned = null; hideTip(); renderTexts(); renderMap(); pushUrl(); }
function pushUrl() { const u = new URL(location.href); u.searchParams.set('lang', LANG); u.searchParams.set('view', VIEW); if (METRIC !== 'orgs') u.searchParams.set('metric', METRIC); else u.searchParams.delete('metric'); history.replaceState(null, '', u); }
$('lang').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; LANG = b.dataset.l; renderTexts(); renderMap(); pushUrl(); });
$('view').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; setView(b.dataset.v); });
$('esraChk').addEventListener('change', e => { ESRA_ON = e.target.checked; renderMap(); });
$('metric').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; METRIC = b.dataset.m; renderTexts(); renderMap(); pushUrl(); });
$('theme').addEventListener('click', () => { const h = document.documentElement; const n = h.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; h.setAttribute('data-theme', n); try { localStorage.setItem('gr-theme', n); } catch(e) {} });
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(renderMap, 120); });

renderTexts(); renderMap();
